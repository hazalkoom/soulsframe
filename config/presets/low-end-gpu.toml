# SoulsFrame Preset -- Low-End GPU Boost (M5 + M6 + M7)
# Copy next to DarkSoulsIII.exe / dinput8.dll as "soulsframe.toml" and set
# offline_acknowledged = true when launching Dark Souls III strictly offline.
# Enables 60 FPS pacing, particle overdraw throttling, and FSR 1 Quality upscaling.

[general]
offline_acknowledged = false
mod_enabled = true
log_level = "info"

[present]
mode = "game"
max_fps = 60

[modules]
frame_telemetry = true
presentation = true
probe_tracer = false
particles = true
upscaler = true
fps_unlock = false
textures = false
overlay = true

[particles]
mode = "auto"
scale_percent = 50
max_instances_per_draw = 128
max_draws_per_frame = 0

[upscaler]
mode = "fsr1"
preset = "quality"
scale_percent = 67
sharpness_percent = 80

[overlay]
show_fps = true
show_status = true
position = "top_left"
scale = 2
opacity_percent = 75

[hotkeys]
enabled = true
toggle_overlay = "F9"
toggle_mod = "F10"
toggle_upscaler = "F11"
toggle_particles = "F8"
toggle_frame_cap = "F12"
