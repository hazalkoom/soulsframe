name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or version name to package (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:43
    steps:
      - name: Install Fedora MinGW toolchain and zip
        run: |
          dnf -y install cmake ninja-build git binutils zip \
            mingw64-gcc-c++ mingw64-winpthreads-static mingw64-headers mingw64-crt

      - uses: actions/checkout@v7

      - name: Configure and build win64-release (clean, no cache)
        run: |
          cmake --preset win64-release -DSF_WERROR=ON
          cmake --build --preset win64-release

      - name: Configure and build win64-probe (clean, no cache)
        run: |
          cmake --preset win64-probe -DSF_WERROR=ON
          cmake --build --preset win64-probe

      - name: Audit DLL exports, static imports, and PE exploit mitigations
        run: |
          for preset in win64-release win64-probe; do
            x86_64-w64-mingw32-objdump -p "build/${preset}/dinput8.dll" > "objdump-${preset}.txt"
            grep -q "DirectInput8Create" "objdump-${preset}.txt"
            for flag in HIGH_ENTROPY_VA DYNAMIC_BASE NX_COMPAT; do
              if ! grep -q "$flag" "objdump-${preset}.txt"; then
                echo "Missing PE security mitigation $flag in ${preset}!"
                cat "objdump-${preset}.txt"
                exit 1
              fi
            done
            if grep -Eqi "libstdc\+\+|libgcc_s|libwinpthread|minhook" "objdump-${preset}.txt"; then
              echo "Unexpected dynamic dependency in ${preset}!"
              cat "objdump-${preset}.txt"
              exit 1
            fi
          done

      - name: Package release and probe archives
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          bash scripts/package-release.sh "${TAG}" artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-testbed
          path: build/win64-release/d3d11_testbed.exe

  smoke-verify:
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: release-testbed
          path: verify_dir
      - name: Extract release dinput8.dll and verify Wine smoke test
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 xvfb unzip
          unzip -o artifacts/soulsframe-*-win64.zip -d verify_dir
          bash scripts/smoke-test.sh "$PWD/verify_dir"

  publish-release:
    needs: [build-and-package, smoke-verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: artifacts

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "artifacts/*.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          body: |
            ## SoulsFrame ${{ github.ref_name }}

            > **OFFLINE ONLY:** SoulsFrame hooks DirectX 11 at runtime. Never launch Dark Souls III online with `dinput8.dll` installed. Switch Steam / Dark Souls III to **Offline Mode** first.

            ### Quick Installation (Step-by-Step)
            1. Download **`soulsframe-${{ github.ref_name }}-win64.zip`** below and extract all files directly into your Dark Souls III `Game` folder (next to `DarkSoulsIII.exe`).
            2. *(Optional)* To use a preset, copy a file from `presets/` next to `DarkSoulsIII.exe` and rename it to `soulsframe.toml` (for weak/integrated GPUs, use `presets/low-end-gpu.toml`).
            3. Open `soulsframe.toml` in Notepad and set `offline_acknowledged = true`.
            4. *(Linux / Steam Deck Proton only)* Set Steam launch option: `WINEDLLOVERRIDES="dinput8=n,b" %command%`.
            5. Launch Dark Souls III **offline**. Full 1-by-1 instructions are also included inside `README.txt` in the zip.

            ### In-Game Hotkeys
            | Key | Action |
            |---|---|
            | `F9` | Show / hide the FPS viewer & hotkey status HUD |
            | `F10` | Live master ON/OFF pause toggle (without restarting the game) |
            | `F11` | Toggle FSR 1 upscaling & sharpening ON/OFF (when `upscaler = true`) |
            | `F8` | Toggle particle lag reduction ON/OFF (when `particles = true`) |
            | `F12` | Toggle FPS cap ON/OFF (when `presentation = true` and `max_fps > 0`) |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
