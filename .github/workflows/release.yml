name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or version name to package (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:43
    steps:
      - name: Install Fedora MinGW toolchain and zip
        run: |
          dnf -y install cmake ninja-build git binutils zip \
            mingw64-gcc-c++ mingw64-winpthreads-static mingw64-headers mingw64-crt

      - uses: actions/checkout@v4

      - name: Configure and build win64-release (clean, no cache)
        run: |
          cmake --preset win64-release
          cmake --build --preset win64-release

      - name: Configure and build win64-probe (clean, no cache)
        run: |
          cmake --preset win64-probe
          cmake --build --preset win64-probe

      - name: Audit DLL exports and static imports
        run: |
          for preset in win64-release win64-probe; do
            x86_64-w64-mingw32-objdump -p "build/${preset}/dinput8.dll" > "objdump-${preset}.txt"
            grep -q "DirectInput8Create" "objdump-${preset}.txt"
            if grep -Eqi "libstdc\+\+|libgcc_s|libwinpthread|minhook" "objdump-${preset}.txt"; then
              echo "Unexpected dynamic dependency in ${preset}!"
              cat "objdump-${preset}.txt"
              exit 1
            fi
          done

      - name: Package release and probe archives
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          mkdir -p dist/release dist/probe artifacts

          cp build/win64-release/dinput8.dll dist/release/
          cp config/soulsframe.toml.example dist/release/soulsframe.toml
          cp README.md LICENSE THIRD_PARTY_LICENSES.txt dist/release/
          (cd dist/release && sha256sum dinput8.dll soulsframe.toml > SHA256SUMS.txt && zip -r "../../artifacts/soulsframe-${TAG}-win64.zip" .)

          cp build/win64-probe/dinput8.dll dist/probe/
          cp config/soulsframe.toml.example dist/probe/soulsframe.toml
          cp README.md LICENSE THIRD_PARTY_LICENSES.txt dist/probe/
          (cd dist/probe && sha256sum dinput8.dll soulsframe.toml > SHA256SUMS.txt && zip -r "../../artifacts/soulsframe-${TAG}-win64-probe.zip" .)

          (cd artifacts && sha256sum *.zip > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: artifacts/*

      - uses: actions/upload-artifact@v7
        with:
          name: release-testbed
          path: build/win64-release/d3d11_testbed.exe

  smoke-verify:
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: release-testbed
          path: verify_dir
      - name: Extract release dinput8.dll and verify Wine smoke test
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 xvfb unzip
          unzip -o artifacts/soulsframe-*-win64.zip -d verify_dir
          bash scripts/smoke-test.sh "$PWD/verify_dir"

  publish-release:
    needs: [build-and-package, smoke-verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "artifacts/*.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          body: |
            ## SoulsFrame ${{ github.ref_name }}

            > **OFFLINE ONLY:** SoulsFrame hooks DirectX 11 at runtime. Never launch Dark Souls III online with `dinput8.dll` installed. By default `offline_acknowledged = false` in `soulsframe.toml` will block hooks until you explicitly opt in.

            ### Installation
            1. Extract `dinput8.dll` and `soulsframe.toml` next to `DarkSoulsIII.exe`.
            2. Edit `soulsframe.toml` and set `offline_acknowledged = true`.
            3. (Steam/Proton on Linux) Set launch option: `WINEDLLOVERRIDES="dinput8=n,b" %command%`.
            4. Launch offline and inspect `soulsframe.log`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
