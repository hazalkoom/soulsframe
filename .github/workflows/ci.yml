name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run repository, layering, license, and docstring guards
        run: bash scripts/ci/check-guards.sh
      - name: Scan git history for leaked secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --verbose --redact --exit-code 1

  changes:
    name: Classify changed files
    needs: guards
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
      cpp: ${{ steps.filter.outputs.cpp }}
      python: ${{ steps.filter.outputs.python }}
      automation: ${{ steps.filter.outputs.automation }}
      workflow: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflow == 'true' }}
      heavy: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.cpp == 'true' || steps.filter.outputs.automation == 'true' || steps.filter.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'reports/**'
            cpp:
              - 'src/**'
              - 'tests/**'
              - 'tools/cpp/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - 'config/**'
              - 'justfile'
            python:
              - 'tools/py/**'
              - '**/*.py'
            automation:
              - 'scripts/**'
              - 'docker/**'
            workflow:
              - '.github/workflows/**'
              - '.github/dependabot.yml'

  docs:
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.workflow == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "**/*.md"

  python-tools:
    name: Python telemetry self-tests
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run stdlib telemetry and bake-tool self-tests
        run: |
          python3 tools/py/analyze_capture.py --self-test
          python3 tools/py/plot_gpu_passes.py --self-test
          python3 tools/py/bake_textures.py --self-test

  static-analysis:
    if: needs.changes.outputs.heavy == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install analysis tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang clang-format clang-tidy cppcheck
      - name: Verify clang-format compliance
        run: find src tests tools/cpp -regex '.*\.\(h\|cpp\)' -exec clang-format --dry-run --Werror {} +
      - name: Configure host compile database for clang-tidy
        run: cmake --preset host-tests -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DSF_WERROR=ON
      - name: Run clang-tidy on pure C++ modules
        run: |
          clang-tidy -p build/host-tests --warnings-as-errors='*' \
            src/core/config.cpp \
            src/core/config_diagnostics.cpp \
            src/core/module_registry.cpp \
            src/core/offline_guard.cpp \
            src/core/runtime_controls.cpp \
            src/core/sha256.cpp \
            src/games/ds3/profile.cpp \
            src/games/ds3/render.cpp \
            src/games/ds3/sig_db.cpp \
            src/gfx/fx/fsr1_math.cpp \
            src/gfx/fx/hud_overlay.cpp \
            src/hooks/sigscan.cpp \
            src/probe/gpu_join.cpp \
            src/probe/jsonl_writer.cpp \
            src/probe/pe_dump.cpp \
            src/probe/trace_types.cpp \
            src/tex/content_hash.cpp \
            src/tex/texture_pack.cpp \
            src/timing/fixed_step.cpp \
            src/timing/frame_pacer.cpp \
            src/timing/frame_stats.cpp \
            src/timing/gpu_timing.cpp \
            src/timing/present_policy.cpp
      - name: Run cppcheck strict static analysis
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c++20 \
            --error-exitcode=1 \
            --inline-suppr \
            -I src \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            --suppress=normalCheckLevelMaxBranches \
            --suppress=passedByValue \
            --suppress=constParameterPointer \
            --suppress=constParameterReference \
            src/core/config.cpp \
            src/core/config_diagnostics.cpp \
            src/core/module_registry.cpp \
            src/core/offline_guard.cpp \
            src/core/runtime_controls.cpp \
            src/core/sha256.cpp \
            src/games/ds3/profile.cpp \
            src/games/ds3/render.cpp \
            src/games/ds3/sig_db.cpp \
            src/gfx/fx/fsr1_math.cpp \
            src/gfx/fx/hud_overlay.cpp \
            src/hooks/sigscan.cpp \
            src/probe/gpu_join.cpp \
            src/probe/jsonl_writer.cpp \
            src/probe/pe_dump.cpp \
            src/probe/trace_types.cpp \
            src/tex/content_hash.cpp \
            src/tex/texture_pack.cpp \
            src/timing/fixed_step.cpp \
            src/timing/frame_pacer.cpp \
            src/timing/frame_stats.cpp \
            src/timing/gpu_timing.cpp \
            src/timing/present_policy.cpp

  host-tests:
    if: needs.changes.outputs.heavy == 'true'
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - preset: host-tests
            cxx: g++
          - preset: host-tests
            cxx: clang++
          - preset: host-asan
            cxx: g++
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build cmake clang
      - run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DSF_WERROR=ON
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }} --output-on-failure

  benchmarks:
    if: needs.changes.outputs.heavy == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++
      - name: Configure and build Release host-bench suite
        run: |
          cmake --preset host-bench -DSF_WERROR=ON
          cmake --build --preset host-bench
          ctest --preset host-bench --output-on-failure
      - name: Execute Release micro-benchmarks
        run: ./build/host-bench/tests/bench/soulsframe_benchmarks --json build/host-bench/bench-results.json
      - name: Publish benchmark summary
        run: |
          python3 - <<'PY'
          import json, os
          data = json.load(open("build/host-bench/bench-results.json"))
          rows = [
              "## Performance Micro-Benchmarks (`host-bench` Release)",
              "",
              "| Benchmark | Category | Median (ns) | Min (ns) | P95 (ns) | Throughput |",
              "|---|---|---:|---:|---:|---:|",
          ]
          for b in data["benchmarks"]:
              if b["mb_per_sec"] > 0:
                  tp = f"{b['mb_per_sec']:.1f} MB/s"
              elif b["ops_per_sec"] >= 1e6:
                  tp = f"{b['ops_per_sec'] / 1e6:.2f} Mops/s"
              elif b["ops_per_sec"] >= 1e3:
                  tp = f"{b['ops_per_sec'] / 1e3:.1f} Kops/s"
              else:
                  tp = f"{b['ops_per_sec']:.1f} ops/s"
              rows.append(
                  f"| `{b['name']}` | `{b['category']}` | {b['median_ns']:.2f} | "
                  f"{b['min_ns']:.2f} | {b['p95_ns']:.2f} | {tp} |"
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(rows) + "\n")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results
          path: build/host-bench/bench-results.json

  coverage:
    if: needs.changes.outputs.heavy == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build and coverage tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build cmake g++ lcov python3-pip
          python3 -m pip install --break-system-packages gcovr
      - name: Build host-cov and enforce minimum line coverage
        env:
          SF_MIN_LINE_COVERAGE: "90"
        run: bash scripts/ci/run-coverage.sh
      - name: Publish coverage summary
        run: |
          python3 - <<'PY'
          import json, os
          data = json.load(open("build/host-cov/report/summary.json"))
          rows = [
              "## Code Coverage Report (`host-cov`)",
              "",
              f"- **Total Lines:** {data['line_percent']:.1f}% ({data['line_covered']}/{data['line_total']})",
              f"- **Total Functions:** {data['function_percent']:.1f}% ({data['function_covered']}/{data['function_total']})",
              f"- **Total Branches:** {data['branch_percent']:.1f}% ({data['branch_covered']}/{data['branch_total']})",
              "",
              "| File | Lines | Functions | Branches |",
              "|---|---|---|---|",
          ]
          for f in data["files"]:
              lp = (100.0 * f["line_covered"] / f["line_total"]) if f["line_total"] else 100.0
              fp = (100.0 * f["function_covered"] / f["function_total"]) if f["function_total"] else 100.0
              bp = (100.0 * f["branch_covered"] / f["branch_total"]) if f["branch_total"] else 100.0
              rows.append(f"| `{f['filename']}` | {lp:.1f}% ({f['line_covered']}/{f['line_total']}) | {fp:.1f}% | {bp:.1f}% |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(rows) + "\n")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: build/host-cov/report/

  fuzz-smoke:
    if: needs.changes.outputs.heavy == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clang and build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake clang
      - name: Build instrumented core for libFuzzer
        run: |
          cmake -B build/host-fuzz -G Ninja \
            -DSF_HOST_ONLY=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-omit-frame-pointer" \
            -DSF_WERROR=ON
          cmake --build build/host-fuzz --target soulsframe_core soulsframe_probe_core
      - name: Build and run libFuzzer targets (10s each)
        run: |
          clang++ -std=c++20 -O1 -g -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer \
            -Isrc -Ibuild/host-fuzz/_deps/tomlplusplus-src/include \
            tests/fuzz/fuzz_config.cpp \
            build/host-fuzz/libsoulsframe_core.a build/host-fuzz/_deps/xxhash-build/libxxhash.a \
            -o build/host-fuzz/fuzz_config
          clang++ -std=c++20 -O1 -g -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer \
            -Isrc \
            tests/fuzz/fuzz_sigscan.cpp \
            build/host-fuzz/libsoulsframe_core.a build/host-fuzz/_deps/xxhash-build/libxxhash.a \
            -o build/host-fuzz/fuzz_sigscan
          clang++ -std=c++20 -O1 -g -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer \
            -Isrc \
            tests/fuzz/fuzz_probe_jsonl.cpp \
            build/host-fuzz/libsoulsframe_probe_core.a build/host-fuzz/libsoulsframe_core.a \
            build/host-fuzz/_deps/xxhash-build/libxxhash.a \
            -o build/host-fuzz/fuzz_probe_jsonl
          clang++ -std=c++20 -O1 -g -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer \
            -Isrc \
            tests/fuzz/fuzz_texture_dds.cpp \
            build/host-fuzz/libsoulsframe_core.a build/host-fuzz/_deps/xxhash-build/libxxhash.a \
            -o build/host-fuzz/fuzz_texture_dds
          clang++ -std=c++20 -O1 -g -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer \
            -Isrc \
            tests/fuzz/fuzz_texture_manifest.cpp \
            build/host-fuzz/libsoulsframe_core.a build/host-fuzz/_deps/xxhash-build/libxxhash.a \
            -o build/host-fuzz/fuzz_texture_manifest
          ./build/host-fuzz/fuzz_config tests/fuzz/corpus/config -max_total_time=10
          ./build/host-fuzz/fuzz_sigscan tests/fuzz/corpus/sigscan -max_total_time=10
          ./build/host-fuzz/fuzz_probe_jsonl tests/fuzz/corpus/probe_jsonl -max_total_time=10
          ./build/host-fuzz/fuzz_texture_dds tests/fuzz/corpus/dds -max_total_time=10
          ./build/host-fuzz/fuzz_texture_manifest tests/fuzz/corpus/manifest -max_total_time=10

  win64:
    if: needs.changes.outputs.heavy == 'true'
    needs: changes
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:43
    steps:
      - name: Install Fedora MinGW toolchain
        run: |
          dnf -y install cmake ninja-build ccache git \
            mingw64-gcc-c++ mingw64-winpthreads-static mingw64-headers mingw64-crt binutils
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-win64-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: ccache-win64-
      - name: Build win64-release
        run: |
          cmake --preset win64-release -DSF_WERROR=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build --preset win64-release
      - name: Build win64-probe
        run: |
          cmake --preset win64-probe -DSF_WERROR=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build --preset win64-probe
      - name: Audit DLL exports, imports, and PE exploit mitigations
        run: |
          for preset in win64-release win64-probe; do
            x86_64-w64-mingw32-objdump -p "build/${preset}/dinput8.dll" > "objdump-${preset}.txt"
            grep -q "DirectInput8Create" "objdump-${preset}.txt"
            for flag in HIGH_ENTROPY_VA DYNAMIC_BASE NX_COMPAT; do
              if ! grep -q "$flag" "objdump-${preset}.txt"; then
                echo "Missing PE security mitigation $flag in ${preset}!"
                cat "objdump-${preset}.txt"
                exit 1
              fi
            done
            if grep -Eqi "libstdc\+\+|libgcc_s|libwinpthread|minhook" "objdump-${preset}.txt"; then
              echo "Unexpected runtime DLL dependency in static ${preset} build!"
              cat "objdump-${preset}.txt"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: dinput8-win64
          path: |
            build/win64-release/dinput8.dll
            build/win64-release/d3d11_testbed.exe
            build/win64-probe/dinput8.dll
            build/win64-probe/d3d11_testbed.exe

  wine-smoke:
    needs: win64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dinput8-win64
          path: build
      - name: Install Wine and Xvfb
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 xvfb
      - name: Run multi-scenario Wine D3D11 smoke suite
        env:
          WINEDEBUG: -all
          WINEDLLOVERRIDES: "dinput8=n,b;mscoree,mshtml="
        run: |
          bash scripts/smoke-test.sh "$PWD/build/win64-release" "$PWD/build/win64-probe"
          python3 tools/py/analyze_capture.py build/win64-probe/soulsframe_capture.jsonl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-logs
          path: |
            build/win64-release/soulsframe.log
            build/win64-release/soulsframe-resize.log
            build/win64-release/soulsframe-msaa.log
            build/win64-release/smoke-result.json
            build/win64-probe/soulsframe.log
            build/win64-probe/soulsframe_capture.jsonl

  docker-verify:
    if: needs.changes.outputs.automation == 'true' || needs.changes.outputs.workflow == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sf-build reproducibility image
        run: docker build -t sf-build -f docker/build.Dockerfile .
