# SonarCloud configuration for SoulsFrame
# Scopes analysis to C++ sources/tests and excludes cross-compile build trees,
# reverse-engineering dumps, and Markdown documentation.

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.exclusions=build/**,re/**,docs/**,reports/**,scripts/**,**/*.md
sonar.cfamily.build-wrapper-output.bypass=true
